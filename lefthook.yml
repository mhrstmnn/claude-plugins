pre-commit:
  jobs:
    - name: format
      glob: "*.{ts,vue,json,md,yaml,yml}"
      run: pnpm run format {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{ts,vue}"
      run: pnpm run lint {staged_files}

    - name: type check
      glob: "*.ts"
      run: pnpm run typecheck
