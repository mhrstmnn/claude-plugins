name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # The oldest Node the plugin supports; the integration test installs the runtime with npm.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      # typescript-lsp runs the server from PATH, as users install it.
      - run: npm install -g typescript-language-server typescript@6
      - run: pnpm run test:integration
